<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>4K Clarity · How can we help?</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fff; --text:#111; --muted:#8e8e93; --line:#efefef; --soft:#f6f6f7;
    --a:#ff9e34; --b:#ff406f; --grad:linear-gradient(90deg,var(--a),var(--b));
    --ok:#22c55e; --warn:#f59e0b; --down:#ef4444;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
  body{padding:calc(env(safe-area-inset-top) + 22px) 22px calc(env(safe-area-inset-bottom) + 28px)}
  .wrap{max-width:420px;margin:0 auto}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  a{color:inherit}

  /* top */
  .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:26px}
  .top img{height:26px;display:block}
  .status{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
  .status i{width:7px;height:7px;border-radius:50%;background:var(--ok)}
  .status.warn i{background:var(--warn)} .status.down i{background:var(--down)}

  /* sophie */
  .sophie{display:flex;align-items:center;gap:12px;margin-bottom:28px;min-height:44px}
  .sophie svg{width:44px;height:44px;flex:none}
  .say{font-size:17px;font-weight:600;line-height:1.35}
  .say b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .dots{display:inline-flex;gap:4px}
  .dots i{width:5px;height:5px;border-radius:50%;background:#c7c7cc;animation:d 1s infinite}
  .dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
  @keyframes d{0%,60%,100%{opacity:.4}30%{opacity:1}}
  .eyes{transform-origin:22px 22px;animation:blink 4.5s infinite}
  @keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}

  /* views */
  .view{display:none;animation:in .2s ease}
  .view.on{display:block}
  @keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  .back{font-size:14px;color:var(--muted);margin-bottom:18px;padding:4px 0}

  /* list rows */
  .list{border-top:1px solid var(--line)}
  .row{display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left;padding:18px 2px;border-bottom:1px solid var(--line);font-size:17px;font-weight:500}
  .row::after{content:"›";color:#c7c7cc;font-size:22px;line-height:1}
  .row:active{opacity:.5}

  /* stepper */
  .stp{display:flex;align-items:center;justify-content:space-between;padding:16px 0;border-bottom:1px solid var(--line)}
  .stp:first-child{border-top:1px solid var(--line)}
  .stp .k{font-size:15px;color:var(--muted)}
  .ctrl{display:flex;align-items:center;gap:16px}
  .pm{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);font-size:20px;line-height:1;display:grid;place-items:center}
  .pm.plus{border:0;background:var(--grad);color:#fff}
  .pm.plus:not(:disabled){animation:pulse 2s infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,64,111,.35)}60%{box-shadow:0 0 0 9px rgba(255,64,111,0)}}
  .pm:disabled{opacity:.25;animation:none}
  .num{min-width:28px;text-align:center;font-size:22px;font-weight:700}
  .num.pop{animation:pop .3s}
  @keyframes pop{50%{transform:scale(1.25)}}
  .nudge{display:block;font-size:13px;font-weight:600;padding:8px 0 0;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;text-align:right;width:100%}
  .nudge.max{background:none;color:var(--ok);cursor:default}
  .stpwrap{margin-bottom:6px}

  .price{text-align:center;margin:34px 0 26px}
  .price .tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;color:#fff;background:var(--grad);padding:4px 10px;border-radius:99px;margin-bottom:12px}
  .price .tag:empty{display:none}
  .big{font-size:52px;font-weight:700;letter-spacing:-2px;line-height:1}
  .per{color:var(--muted);font-size:14px;margin-top:8px}
  .save{font-size:14px;font-weight:600;color:var(--ok);margin-top:6px;min-height:18px}
  .meter{height:3px;background:var(--line);border-radius:3px;margin:16px auto 0;width:60%;overflow:hidden}
  .meter i{display:block;height:100%;width:0;background:var(--grad);transition:width .45s}

  /* buttons */
  .btn{display:block;width:100%;text-align:center;border-radius:99px;padding:16px;font-size:16px;font-weight:600;text-decoration:none;margin-top:10px}
  .btn.main{background:var(--text);color:#fff}
  .btn.grad{background:var(--grad);color:#fff}
  .btn.line{border:1px solid var(--line)}
  .link{display:block;text-align:center;font-size:14px;color:var(--muted);margin-top:22px;text-decoration:none}
  .link b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .hint{font-size:13px;color:var(--muted);text-align:center;margin-top:12px}

  /* summary */
  .sum{border-top:1px solid var(--line);margin-bottom:22px}
  .sum div{display:flex;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--line);font-size:15px}
  .sum span{color:var(--muted)}
  .sum .t{font-size:20px;font-weight:700}

  /* chips + steps */
  .chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:16px;scrollbar-width:none}
  .chip{padding:8px 14px;border-radius:99px;border:1px solid var(--line);font-size:14px;white-space:nowrap}
  .chip.sel{border-color:var(--text);background:var(--text);color:#fff}
  ol.steps{list-style:none;counter-reset:s;margin-bottom:8px}
  ol.steps li{counter-increment:s;display:flex;gap:12px;padding:9px 0;font-size:15px;line-height:1.45}
  ol.steps li::before{content:counter(s);flex:none;width:22px;height:22px;border-radius:50%;background:var(--soft);font-size:12px;font-weight:600;display:grid;place-items:center;margin-top:1px}
  code{font-family:ui-monospace,Menlo,monospace;font-weight:700;background:var(--soft);padding:1px 6px;border-radius:5px}
  .or{font-size:13px;color:var(--muted);text-align:center;margin:20px 0 4px}

  /* inputs */
  input{width:100%;border:0;border-bottom:1px solid var(--line);padding:14px 0;font:inherit;font-size:16px;background:transparent;border-radius:0}
  input:focus{outline:none;border-color:var(--text)}
  input::placeholder{color:#b5b5ba}

  /* faq */
  details{border-bottom:1px solid var(--line)}
  details:first-of-type{border-top:1px solid var(--line)}
  summary{list-style:none;padding:17px 0;font-size:16px;font-weight:500;display:flex;justify-content:space-between;cursor:pointer}
  summary::-webkit-details-marker{display:none}
  summary::after{content:"+";color:var(--muted)}
  details[open] summary::after{content:"−"}
  details p{color:var(--muted);font-size:14px;line-height:1.55;padding-bottom:16px}

  .ticket{text-align:center;font-family:ui-monospace,Menlo,monospace;font-size:26px;font-weight:700;margin:26px 0 8px}
  footer{text-align:center;font-size:11px;color:#c7c7cc;margin-top:40px}
</style>
<style>
  .top-r{display:flex;align-items:center;gap:2px}
  .lang button{font-size:12px;font-weight:600;color:#c7c7cc;padding:6px 7px;border-radius:8px}
  .lang button.sel{color:var(--text);background:var(--soft)}
  .statusline{margin:-14px 0 22px 56px}
  .video{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:600;text-decoration:none;margin:2px 0 6px}
  .video::before{content:"▶";display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--grad);color:#fff;font-size:10px;padding-left:2px}
  .video[hidden]{display:none}
  .rate{display:flex;align-items:center;gap:8px;font-size:14px;margin:0 0 14px;padding:10px 14px;border-radius:12px;background:linear-gradient(90deg,rgba(255,158,52,.12),rgba(255,64,111,.12))}
  .rate[hidden]{display:none}
  .reply{display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px;color:var(--muted);margin-top:16px}
  .reply::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok)}
  .offers{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px}
  .offer{position:relative;text-align:left;border-radius:16px;padding:14px 14px 13px;background:var(--soft);overflow:hidden}
  .offer::before{content:"";position:absolute;inset:0;border-radius:16px;padding:1.5px;background:var(--grad);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
  .offer .ot{font-size:11px;font-weight:700;letter-spacing:.06em;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .offer .oh{display:block;font-size:15px;font-weight:700;margin-top:4px;line-height:1.3}
  .devices{margin:30px 0 4px;text-align:center}
  .devices svg{width:100%;max-width:340px;height:auto}
  .devices p{font-size:12px;color:var(--muted);margin-top:4px}
  .hero{font-size:24px;font-weight:700;letter-spacing:-.5px;line-height:1.25;margin-bottom:18px}
  .hero b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  ul.perks{list-style:none;border-top:1px solid var(--line);margin-bottom:18px}
  ul.perks li{display:flex;gap:10px;align-items:flex-start;padding:13px 0;border-bottom:1px solid var(--line);font-size:15px}
  ul.perks li::before{content:"✓";font-weight:700;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
  .stats div{background:var(--soft);border-radius:14px;padding:14px;text-align:center}
  .stats b{display:block;font-size:24px;font-weight:700;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .stats span{font-size:12px;color:var(--muted)}
</style>
</head>

    react: { free: n => `Bien joué ! C'est comme <b>${n} mois offerts</b> 😍`, saved: x => `Super, vous économisez <b>${x}</b> 🙌`, allTv: "Toutes les télés couvertes 🏠", tv: "Plus de télés, plus de plaisir 📺" },
    issues: ["Pas de signal", "Chaînes figées", "Le film ne démarre pas", "Nouvelle télé", "Impossible d'installer l'app", "Autre problème"],
    tips: [
      ["Redémarrez la télé et la box", "App → <b>Playlist</b> → <b>4KCLARITY</b> → <b>Connect</b>", "Désactivez tout VPN"],
      ["Changez de chaîne puis revenez", "Redémarrez la télé et la box", "Désactivez tout VPN"],
      ["Fermez et rouvrez l'app", "<b>Settings → Player</b> → essayez un autre lecteur"],
      null, null,
      ["Redémarrez la télé et la box", "App → <b>Playlist</b> → <b>4KCLARITY</b> → <b>Connect</b>"]
    ],
    guide: (dev, store) => dev === "Firestick"
      ? [`Ouvrez <b>${store}</b>`, "Tapez <code>481220</code> · installez <b>IBO Player Pro</b>", "Ouvrez-la · notez <b>MAC</b> + <b>Device key</b>"]
      : [`${store} → <b>IBO Player Pro</b>`, "Installez-la et ouvrez-la", "Notez <b>MAC</b> + <b>Device key</b>"],
    dl: u => `Tapez ${dlLink(u)} <b>exactement</b> dans votre navigateur pour télécharger la bonne app`,
    sendBelow: "Envoyez-les ci-dessous", sendNewMac: "Envoyez la nouvelle MAC ci-dessous", trialTag: "Essai",
    faqs: [
      ["Quelle app ?", "IBO Player Pro. Envoyez-nous l'adresse MAC et le Device key affichés."],
      ["Où est ma MAC ?", "Sur le premier écran d'IBO Player Pro."],
      ["Nouvelle télé ?", "Installez IBO Player Pro, puis créez un ticket avec la nouvelle MAC. Gratuit si vous renouvelez."],
      ["Ça ne charge pas ?", "Redémarrez, puis App → Playlist → 4KCLARITY → Connect. Sans VPN."],
      ["Comment payer ?", "Renouveler ou acheter → choisissez → payez par carte → envoyez la capture."]
    ],
  }
};

/* ====== CORE ====== */
const $ = id => document.getElementById(id);
const money = n => "$" + n.toFixed(2);
const wa = t => `https://wa.me/${WHATSAPP}?text=${encodeURIComponent(t)}`;
let lang = "en", L = I18N.en, current = "v-home";
try { lang = localStorage.getItem("4kc-lang") || ""; } catch (e) {}
if (!I18N[lang]) lang = (navigator.language || "en").slice(0, 2);
if (!I18N[lang]) lang = "en";

const VKEY = { "v-vip": "vip", "v-refer": "refer", "v-home": "home", "v-plan": "plan", "v-pay": "pay", "v-trial": "trial", "v-issue": "issue", "v-ticket": "ticket", "v-done": "done", "v-faq": "faq" };
let sayTimer;
function sayFor(id){ return (id === "v-home" ? L.hi(new Date().getHours()) + " " : "") + L.says[VKEY[id]]; }
function speak(id){
  clearTimeout(sayTimer);
  $("say").innerHTML = '<span class="dots"><i></i><i></i><i></i></span>';
  sayTimer = setTimeout(() => $("say").innerHTML = sayFor(id), 550);
}
function say(html){ clearTimeout(sayTimer); $("say").innerHTML = html; }
function go(id){
  current = id;
  document.querySelectorAll(".view").forEach(v => v.classList.toggle("on", v.id === id));
  speak(id); window.scrollTo({ top: 0, behavior: "smooth" });
}
document.addEventListener("click", e => { const b = e.target.closest("[data-go]"); if (b) go(b.dataset.go); });

/* ====== PLAN (+/−) ====== */
const MONTHS = Object.keys(PRICES).map(Number).sort((a, b) => a - b), MAX_TV = 4;
let mi = Math.max(0, MONTHS.indexOf(START_MONTHS)), tv = START_TVS, order = {};
const price = (m, t) => PRICES[m][t - 1];
const saving = (m, t) => price(1, t) * m - price(m, t);
const pct = (m, t) => saving(m, t) / (price(1, t) * m);
const MAX_PCT = Math.max(...MONTHS.flatMap(m => [1, 2, 3, 4].map(t => pct(m, t))));
let shown = 0;
function countTo(el, to){
  const from = shown, t0 = performance.now();
  (function step(now){
    const k = Math.min(1, (now - t0) / 350);
    el.textContent = money(from + (to - from) * (1 - Math.pow(1 - k, 3)));
    if (k < 1) requestAnimationFrame(step); else shown = to;
  })(t0);
}
function renderPlan(changed){
  const m = MONTHS[mi], total = price(m, tv), s = saving(m, tv), p = pct(m, tv);
  $("mVal").textContent = m; $("tVal").textContent = tv;
  if (changed) { const n = $(changed + "Val"); n.classList.remove("pop"); void n.offsetWidth; n.classList.add("pop"); }
  document.querySelector('[data-k="m"][data-d="-1"]').disabled = mi === 0;
  document.querySelector('[data-k="t"][data-d="-1"]').disabled = tv === 1;
  $("mPlus").disabled = mi === MONTHS.length - 1;
  $("tPlus").disabled = tv === MAX_TV;
  if (mi < MONTHS.length - 1) { const nm = MONTHS[mi + 1]; $("mNudge").className = "nudge"; $("mNudge").textContent = L.moreM(nm - m, money(price(nm, tv) - total)); }
  else { $("mNudge").className = "nudge max"; $("mNudge").textContent = L.bestOk; }
  if (tv < MAX_TV) { const x = price(m, tv + 1) - total; $("tNudge").className = "nudge"; $("tNudge").textContent = m === 1 ? L.moreT(money(x)) : L.moreTmo(money(x / m)); }
  else { $("tNudge").className = "nudge max"; $("tNudge").textContent = L.homeOk; }
  countTo($("pTotal"), total);
  $("pPer").textContent = m === 1 ? L.oneMonth : money(total / m) + L.perMo + (tv > 1 ? ` · ${money(total / m / tv)} ${L.perTv}` : "");
  $("pSave").textContent = s > 0.5 ? L.save(money(s)) : "";
  $("pTag").textContent = mi === MONTHS.length - 1 ? L.best : (p > 0.05 ? L.savePct(Math.round(p * 100)) : "");
  $("meter").style.width = Math.max(0, Math.round(p / MAX_PCT * 100)) + "%";
  $("toPay").textContent = `${L.cont} · ${money(total)}`;
  order = { m, tv, total };
}
$("v-plan").addEventListener("click", e => {
  const b = e.target.closest("[data-k]");
  if (!b || b.disabled || b.classList.contains("max")) return;
  const d = +b.dataset.d, k = b.dataset.k;
  if (k === "m") mi = Math.max(0, Math.min(MONTHS.length - 1, mi + d));
  else tv = Math.max(1, Math.min(MAX_TV, tv + d));
  renderPlan(k);
  if (d > 0) {
    const m = MONTHS[mi], s = saving(m, tv);
    if (k === "m" && mi === MONTHS.length - 1) say(L.react.free(Math.floor(s / price(1, tv))));
    else if (k === "m" && s > 0.5) say(L.react.saved(money(s)));
    else if (k === "t" && tv === MAX_TV) say(L.react.allTv);
    else if (k === "t") say(L.react.tv);
  }
});
function renderPay(){
  const { m, tv: t, total } = order;
  $("sumPlan").textContent = `${m} ${L.mUnit(m)} · ${t} ${L.tUnit(t)}`;
  $("sumTotal").textContent = money(total);
  $("exactHint").innerHTML = L.exact(money(total));
  $("payBtn").textContent = `${L.pay} ${money(total)}`;
  const cap = w => w.charAt(0).toUpperCase() + w.slice(1);
  $("payBtn").href = wa(L.order(`${m} ${cap(L.mUnit(m))} – ${t} ${cap(L.tUnit(t))}`, money(total), payNew));
  document.querySelectorAll("#payMode .chip").forEach(c => c.classList.toggle("sel", (c.dataset.mode === "new") === payNew));
}
let payNew = false;
$("payMode").addEventListener("click", e => { const c = e.target.closest(".chip"); if (!c) return; payNew = c.dataset.mode === "new"; renderPay(); });
$("toPay").addEventListener("click", () => { renderPay(); go("v-pay"); });

/* ====== GUIDES (+ video) ====== */
const guideState = {};
function renderGuide(chipsId, listId, videoId, dev, tailKey){
  guideState[chipsId] = { listId, videoId, dev, tailKey };
  $(chipsId).innerHTML = DEVICES.map(d => `<button type="button" class="chip${d === dev ? " sel" : ""}" data-dev="${d}">${d}</button>`).join("");
  const base = L.guide(dev, STORE[dev]);
  if (chipsId === "trialDevs" && DL[dev]) base[0] = `<span>${L.dl(DL[dev])}</span>`;
  const steps = base.concat(tailKey ? [L[tailKey]] : []);
  $(listId).innerHTML = steps.map(s => `<li>${s}</li>`).join("");
  const v = $(videoId);
  if (VIDEOS[dev]) { v.href = VIDEOS[dev]; v.hidden = false; } else v.hidden = true;
}
["fixDevs", "trialDevs"].forEach(id => $(id).addEventListener("click", e => {
  const c = e.target.closest("[data-dev]"); if (!c) return;
  const g = guideState[id]; renderGuide(id, g.listId, g.videoId, c.dataset.dev, g.tailKey);
}));

/* ====== TRIAL ====== */
$("trialForm").addEventListener("submit", e => {
  e.preventDefault();
  $("ticketId").textContent = L.trialTag;
  $("sendTicket").href = wa(`Free trial\nName: ${$("trName").value.trim()}\nDevice: ${guideState.trialDevs.dev}\nMAC: ${$("trMac").value.trim()}\nDevice key: ${$("trKey").value.trim()}`);
  go("v-done");
});

/* ====== ISSUES ====== */
let issueIdx = 0;
function renderIssues(){ $("issues").innerHTML = L.issues.map((t, i) => `<button class="row" data-i="${i}">${t}</button>`).join(""); }
function renderTips(){
  const i = issueIdx;
  $("fixRate").innerHTML = L.fixRate; $("fixRate").hidden = !L.tips[i];
  if (L.tips[i]) { $("fixDevs").style.display = "none"; $("fixVideo").hidden = true; $("tips").innerHTML = L.tips[i].map(t => `<li>${t}</li>`).join(""); }
  else { $("fixDevs").style.display = "flex"; renderGuide("fixDevs", "tips", "fixVideo", guideState.fixDevs?.dev || "Firestick", i === 3 ? "sendNewMac" : ""); }
}
$("issues").addEventListener("click", e => {
  const b = e.target.closest("[data-i]"); if (!b) return;
  issueIdx = +b.dataset.i; renderTips(); go("v-ticket");
});
$("ticketForm").addEventListener("submit", e => {
  e.preventDefault();
  const id = "T-" + Date.now().toString(36).slice(-5).toUpperCase();
  const lines = [`Ticket ${id}`, `Issue: ${I18N.en.issues[issueIdx]}`, `Name: ${$("tName").value.trim()}`];
  if ($("tMac").value.trim()) lines.push(`MAC: ${$("tMac").value.trim()}`);
  if ($("tNote").value.trim()) lines.push(`Note: ${$("tNote").value.trim()}`);
  lines.push(`Language: ${lang.toUpperCase()}`);
  $("ticketId").textContent = id;
  $("sendTicket").href = wa(lines.join("\n"));
  go("v-done");
});

/* ====== LANGUAGE ====== */
function applyLang(l){
  lang = l; L = I18N[l];
  try { localStorage.setItem("4kc-lang", l); } catch (e) {}
  document.documentElement.lang = l;
  document.querySelectorAll("[data-lang]").forEach(b => b.classList.toggle("sel", b.dataset.lang === l));
  document.querySelectorAll("[data-t]").forEach(el => el.innerHTML = L[el.dataset.t]);
  document.querySelectorAll("[data-ph]").forEach(el => el.placeholder = L[el.dataset.ph]);
  $("statusText").textContent = L.status[STATUS.level];
  $("replyTime").textContent = L.reply(REPLY_MINUTES);
  $("faqs").innerHTML = L.faqs.map(([q, a]) => `<details><summary>${q}</summary><p>${a}</p></details>`).join("");
  $("vipPerks").innerHTML = L.vipPerks.map(p => `<li>${p}</li>`).join("");
  $("vipBtn").href = VIP_URL || wa(L.vipMsg);
  $("referCode").href = REFER_URL;
  $("referShare").href = "https://wa.me/?text=" + encodeURIComponent(L.referText + REFER_URL);
  renderIssues(); renderPlan();
  renderGuide("trialDevs", "trialGuide", "trialVideo", guideState.trialDevs?.dev || "Firestick", "sendBelow");
  if (current === "v-ticket") renderTips();
  if (current === "v-pay") renderPay();
  if (current !== "v-done") say(sayFor(current));
}
$("lang").addEventListener("click", e => { const b = e.target.closest("[data-lang]"); if (b) applyLang(b.dataset.lang); });

$("siteBtn").href = SITE;
$("status").className = "status statusline " + STATUS.level;
applyLang(lang);
speak("v-home");
</script>
</body>
</html>
